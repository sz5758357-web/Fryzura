<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hairu – AI Hairstyle Generator</title>
  <style>
    :root {
      --bg-color: #0b0b0d;
      --card-bg: #16161a;
      --accent: #6c5ce7;
      --text-color: #ffffff;
      --text-muted: #a0a0a0;
      --border-radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background-color: #000000;
      border: 1px solid #222;
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 26px;
      font-weight: 700;
    }

    header p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }

    /* Sekcja ze zdjęciem */
    .photo-section {
      margin-bottom: 20px;
    }

    .camera-box {
      background-color: var(--card-bg);
      border: 2px dashed #333;
      border-radius: var(--border-radius);
      height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .camera-box video, .camera-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0; left: 0;
    }

    /* Odbicie lustrzane na podglądzie kamery dla naturalnego wrażenia */
    .camera-box video {
      transform: scaleX(-1);
    }

    .camera-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-secondary {
      flex: 1;
      padding: 10px;
      border: 1px solid #333;
      background: #16161a;
      color: #fff;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
    }

    /* Wybór stylów */
    .section-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .styles-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .style-card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .style-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(108, 92, 231, 0.4);
    }

    .style-card img {
      width: 100%;
      height: 90px;
      object-fit: cover;
      display: block;
    }

    .style-card p {
      text-align: center;
      padding: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .btn-generate {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #8e2de2, #4a00e0);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Overlay Ładowania AI */
    .loader-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      z-index: 10;
      border-radius: 28px;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Wynik Przed / Po */
    .result-container {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      border-radius: 28px;
      z-index: 20;
      padding: 20px;
      flex-direction: column;
      justify-content: space-between;
    }

    .comparison-slider {
      position: relative;
      width: 100%;
      height: 380px;
      border-radius: 20px;
      overflow: hidden;
      user-select: none;
    }

    .comparison-slider img {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .img-after {
      width: 100%;
      clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
    }

    .slider-handle {
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      width: 4px;
      background: #fff;
      cursor: ew-resize;
      transform: translateX(-50%);
    }

    .slider-handle::after {
      content: '↔';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 32px; height: 32px;
      background: #fff;
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .badge {
      position: absolute;
      top: 12px;
      padding: 4px 10px;
      background: rgba(0,0,0,0.6);
      font-size: 11px;
      font-weight: 700;
      border-radius: 12px;
    }
    .badge-before { left: 12px; }
    .badge-after { right: 12px; }

    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Hairu AI</h1>
      <p>Stwórz i wygeneruj nową fryzurę</p>
    </header>

    <div class="photo-section">
      <div class="camera-box">
        <video id="webcam" autoplay playsinline></video>
        <img id="captured-img" style="display:none;" alt="Twoje zdjęcie">
        <span id="placeholder-text" style="display:none;">📷 Włącz aparat lub wgraj zdjęcie</span>
      </div>

      <div class="camera-actions">
        <button class="btn-secondary" onclick="snapPhoto()">Zrób zdjęcie 📸</button>
        <button class="btn-secondary" onclick="document.getElementById('file-input').click()">Z pliku 📁</button>
      </div>
      <input type="file" id="file-input" accept="image/*" onchange="handleFileUpload(event)">
    </div>

    <div class="section-title">Wybierz docelowy styl AI</div>
    <div class="styles-grid">
      <div class="style-card selected" onclick="selectStyle(this, 'Messy Textured Hair')">
        <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=300" alt="Messy">
        <p>Messy Crop</p>
      </div>
      <div class="style-card" onclick="selectStyle(this, 'Classic Quiff')">
        <img src="https://images.unsplash.com/photo-1503443207922-dff7d543fd0e?w=300" alt="Quiff">
        <p>Classic Quiff</p>
      </div>
      <div class="style-card" onclick="selectStyle(this, 'Slicked Back')">
        <img src="https://images.unsplash.com/photo-1622286342621-4bd786c2447c?w=300" alt="Slicked">
        <p>Slicked Back</p>
      </div>
      <div class="style-card" onclick="selectStyle(this, 'Modern Fade')">
        <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=300" alt="Fade">
        <p>Modern Fade</p>
      </div>
    </div>

    <button class="btn-generate" onclick="generateAIHair()">Wygeneruj nową fryzurę ✨</button>

    <!-- Overlay Loader -->
    <div class="loader-overlay" id="loader">
      <div class="spinner"></div>
      <p style="font-size: 14px;">Generowanie nowej fryzury...</p>
    </div>

    <!-- Widok Wyniku -->
    <div class="result-container" id="result-view">
      <div class="comparison-slider" id="slider">
        <img id="res-before" src="" alt="Przed">
        <img id="res-after" class="img-after" src="" alt="Po">
        <span class="badge badge-before">PRZED</span>
        <span class="badge badge-after">PO (AI)</span>
        <div class="slider-handle" id="slider-handle"></div>
      </div>
      <button class="btn-secondary" style="width:100%; padding:14px; margin-top:15px;" onclick="closeResult()">Wygeneruj inną</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const capturedImg = document.getElementById('captured-img');
    let capturedBase64 = null;
    let selectedStyle = 'Messy Crop';

    // Inicjalizacja kamery
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        video.srcObject = stream;
      } catch (err) {
        document.getElementById('placeholder-text').style.display = 'block';
        video.style.display = 'none';
      }
    }
    startCamera();

    // Wykonanie zdjęcia BEZ ODBICIA LUSTRZANEGO
    function snapPhoto() {
      if (!video.srcObject) return;
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');

      // Odwrócenie obrazu w poziomie, żeby zdjęcie odpowiadało rzeczywistości
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      capturedBase64 = canvas.toDataURL('image/jpeg');
      capturedImg.src = capturedBase64;
      capturedImg.style.display = 'block';
      video.style.display = 'none';
    }

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        capturedBase64 = evt.target.result;
        capturedImg.src = capturedBase64;
        capturedImg.style.display = 'block';
        video.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    function selectStyle(el, name) {
      document.querySelectorAll('.style-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedStyle = name;
    }

    // Generowanie nowej fryzury na zdjęciu (Canvas transformation)
    function generateAIHair() {
      if (!capturedBase64) {
        alert('Najpierw zrób lub wgraj zdjęcie!');
        return;
      }

      document.getElementById('loader').style.display = 'flex';

      setTimeout(() => {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');

          // Rysowanie bazowego zdjęcia
          ctx.drawImage(img, 0, 0);

          // Generowanie cieniowania i tekstury imitującej nową fryzurę w górnej części głowy
          const hairGradient = ctx.createRadialGradient(
            canvas.width / 2, canvas.height * 0.25, 10,
            canvas.width / 2, canvas.height * 0.25, canvas.width * 0.4
          );
          hairGradient.addColorStop(0, 'rgba(30, 20, 10, 0.85)');
          hairGradient.addColorStop(0.7, 'rgba(15, 15, 15, 0.6)');
          hairGradient.addColorStop(1, 'transparent');

          ctx.fillStyle = hairGradient;
          ctx.beginPath();
          ctx.arc(canvas.width / 2, canvas.height * 0.25, canvas.width * 0.35, 0, Math.PI * 2);
          ctx.fill();

          // Nakładanie delikatnego filtra wykończeniowego AI
          ctx.fillStyle = 'rgba(108, 92, 231, 0.08)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          const generatedResult = canvas.toDataURL('image/jpeg');

          document.getElementById('res-before').src = capturedBase64;
          document.getElementById('res-after').src = generatedResult;
          document.getElementById('loader').style.display = 'none';
          document.getElementById('result-view').style.display = 'flex';

          initSlider();
        };
        img.src = capturedBase64;
      }, 2500);
    }

    function closeResult() {
      document.getElementById('result-view').style.display = 'none';
    }

    function initSlider() {
      const slider = document.getElementById('slider');
      const afterImg = document.getElementById('res-after');
      const handle = document.getElementById('slider-handle');
      let isDragging = false;

      function setPos(x) {
        const rect = slider.getBoundingClientRect();
        let posX = x - rect.left;
        if (posX < 0) posX = 0;
        if (posX > rect.width) posX = rect.width;
        const pct = (posX / rect.width) * 100;
        afterImg.style.clipPath = `polygon(0 0, ${pct}% 0, ${pct}% 100%, 0 100%)`;
        handle.style.left = `${pct}%`;
      }

      slider.addEventListener('mousedown', (e) => { isDragging = true; setPos(e.clientX); });
      slider.addEventListener('touchstart', (e) => { isDragging = true; setPos(e.touches[0].clientX); });
      window.addEventListener('mouseup', () => isDragging = false);
      window.addEventListener('touchend', () => isDragging = false);
      window.addEventListener('mousemove', (e) => { if (isDragging) setPos(e.clientX); });
      window.addEventListener('touchmove', (e) => { if (isDragging) setPos(e.touches[0].clientX); });
    }
  </script>
</body>
</html>
