<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hairu – AI Hairstyle Studio</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #121214;
      --accent: #6c5ce7;
      --text: #ffffff;
      --muted: #8e8e93;
      --border: #222226;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app {
      width: 100%;
      max-width: 414px;
      height: 844px;
      max-height: 95vh;
      background-color: #050505;
      border: 1px solid var(--border);
      border-radius: 36px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* Moduł Kamery / Wgrywania Zdjęcia */
    .preview-box {
      width: 100%;
      height: 260px;
      background-color: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Podgląd w lustrze dla naturalnego wrażenia */
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .camera-btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-sub {
      flex: 1;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    /* Wybór stylu */
    .section-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 15px;
      margin-bottom: 8px;
    }

    .grid-styles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .style-item {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .style-item.active {
      border-color: var(--accent);
    }

    .style-item img {
      width: 100%;
      height: 95px;
      object-fit: cover;
      display: block;
    }

    .style-item span {
      display: block;
      text-align: center;
      padding: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Main CTA Button */
    .btn-main {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #7c3aed, #4c1d95);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
    }

    /* Loader screen */
    .loader {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(10px);
      z-index: 50;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .spin {
      width: 48px;
      height: 48px;
      border: 4px solid #222;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: rotation 0.8s infinite linear;
      margin-bottom: 16px;
    }

    @keyframes rotation {
      to { transform: rotate(360deg); }
    }

    /* Result Comparison Slider */
    .result-screen {
      display: none;
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 100;
      padding: 20px;
      flex-direction: column;
      justify-content: space-between;
    }

    .slider-box {
      position: relative;
      width: 100%;
      height: 80%;
      border-radius: 24px;
      overflow: hidden;
      user-select: none;
    }

    .slider-box img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .img-after-wrapper {
      position: absolute;
      inset: 0;
      width: 50%;
      overflow: hidden;
    }

    .img-after-wrapper img {
      width: 414px; /* Szerokość kontenera */
      max-width: none;
    }

    .slider-line {
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      width: 3px;
      background: #fff;
      transform: translateX(-50%);
    }

    .slider-handle {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 36px; height: 36px;
      background: #fff;
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
    }

    .tag {
      position: absolute;
      top: 14px;
      padding: 4px 12px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      font-size: 11px;
      font-weight: 700;
      border-radius: 20px;
    }

    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <div class="app">
    <div class="top-bar">
      <div class="brand-title">Hairu</div>
    </div>

    <!-- Podgląd zdjęcia / Kamery -->
    <div class="preview-box">
      <video id="webcam" autoplay playsinline></video>
      <img id="photo-preview" alt="Zdjęcie">
    </div>

    <div class="camera-btn-group">
      <button class="btn-sub" onclick="takeSnapshot()">Zrób zdjęcie 📸</button>
      <button class="btn-sub" onclick="document.getElementById('file-input').click()">Z galerii 📁</button>
      <input type="file" id="file-input" accept="image/*" onchange="uploadFile(event)">
    </div>

    <!-- Wybór fryzury -->
    <div class="section-label">Wybierz stylizacji</div>
    <div class="grid-styles">
      <div class="style-item active" onclick="pickStyle(this, 'Messy Crop')">
        <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=300" alt="Messy">
        <span>Messy Crop</span>
      </div>
      <div class="style-item" onclick="pickStyle(this, 'Textured Quiff')">
        <img src="https://images.unsplash.com/photo-1503443207922-dff7d543fd0e?w=300" alt="Quiff">
        <span>Textured Quiff</span>
      </div>
      <div class="style-item" onclick="pickStyle(this, 'Slicked Back')">
        <img src="https://images.unsplash.com/photo-1622286342621-4bd786c2447c?w=300" alt="Slicked">
        <span>Slicked Back</span>
      </div>
      <div class="style-item" onclick="pickStyle(this, 'Buzz Cut')">
        <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=300" alt="Buzz">
        <span>Buzz Cut</span>
      </div>
    </div>

    <button class="btn-main" onclick="runAiGen()">Generuj Nowy Look ✨</button>

    <!-- Ekran Ładowania -->
    <div class="loader" id="loader">
      <div class="spin"></div>
      <p style="font-weight: 600; font-size: 15px;">Generowanie fryzury przez AI...</p>
    </div>

    <!-- Ekran Wyniku Przed / Po -->
    <div class="result-screen" id="result-screen">
      <div class="slider-box" id="slider-box">
        <!-- ZDJĘCIE PRZED -->
        <img id="img-before" src="" alt="Przed">
        <span class="tag" style="left: 14px;">PRZED</span>

        <!-- ZDJĘCIE PO -->
        <div class="img-after-wrapper" id="after-wrapper">
          <img id="img-after" src="" alt="Po">
        </div>
        <span class="tag" style="right: 14px;">PO</span>

        <div class="slider-line" id="slider-line">
          <div class="slider-handle">↔</div>
        </div>
      </div>

      <button class="btn-sub" style="padding: 16px; margin-top: 10px;" onclick="closeResult()">Wypróbuj inny styl</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const photoPreview = document.getElementById('photo-preview');
    let base64Image = null;
    let selectedStyle = 'Messy Crop';

    // Inicjalizacja kamery
    async function initCam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        video.srcObject = stream;
      } catch (err) {
        console.warn("Kamera niedostępna lub brak uprawnień.");
      }
    }
    initCam();

    // Wykonanie zdjęcia bez odbicia lustrzanego
    function takeSnapshot() {
      if (!video.srcObject) return;
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');

      // Odwrócenie obrazu w poziomie (dzięki temu zapisane zdjęcie wygląda naturalnie)
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      base64Image = canvas.toDataURL('image/jpeg');
      photoPreview.src = base64Image;
      photoPreview.style.display = 'block';
      video.style.display = 'none';
    }

    function uploadFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        base64Image = evt.target.result;
        photoPreview.src = base64Image;
        photoPreview.style.display = 'block';
        video.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    function pickStyle(el, styleName) {
      document.querySelectorAll('.style-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      selectedStyle = styleName;
    }

    // Uruchomienie generowania
    function runAiGen() {
      if (!base64Image) {
        alert('Zrób zdjęcie lub wybierz plik z galerii!');
        return;
      }

      document.getElementById('loader').style.display = 'flex';

      // TUTAJ MOŻNA PODPIĄĆ REALNE API AI (np. Replicate API)
      // W poniższej symulacji nakładana jest modyfikacja obrazu na płótnie Canvas
      setTimeout(() => {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);

          // Cieniowanie AI włosów
          const grad = ctx.createRadialGradient(
            canvas.width / 2, canvas.height * 0.22, 10,
            canvas.width / 2, canvas.height * 0.22, canvas.width * 0.38
          );
          grad.addColorStop(0, 'rgba(20, 15, 10, 0.9)');
          grad.addColorStop(0.8, 'rgba(10, 10, 10, 0.7)');
          grad.addColorStop(1, 'transparent');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(canvas.width / 2, canvas.height * 0.22, canvas.width * 0.35, 0, Math.PI * 2);
          ctx.fill();

          const generatedResult = canvas.toDataURL('image/jpeg');

          document.getElementById('img-before').src = base64Image;
          document.getElementById('img-after').src = generatedResult;

          document.getElementById('loader').style.display = 'none';
          document.getElementById('result-screen').style.display = 'flex';
          setupSlider();
        };
        img.src = base64Image;
      }, 2500);
    }

    function closeResult() {
      document.getElementById('result-screen').style.display = 'none';
    }

    // Obsługa suwaka porównawczego Przed / Po
    function setupSlider() {
      const box = document.getElementById('slider-box');
      const wrapper = document.getElementById('after-wrapper');
      const line = document.getElementById('slider-line');
      let dragging = false;

      function update(x) {
        const rect = box.getBoundingClientRect();
        let posX = x - rect.left;
        if (posX < 0) posX = 0;
        if (posX > rect.width) posX = rect.width;

        const pct = (posX / rect.width) * 100;
        wrapper.style.width = `${pct}%`;
        line.style.left = `${pct}%`;
      }

      box.addEventListener('mousedown', (e) => { dragging = true; update(e.clientX); });
      box.addEventListener('touchstart', (e) => { dragging = true; update(e.touches[0].clientX); });
      window.addEventListener('mouseup', () => dragging = false);
      window.addEventListener('touchend', () => dragging = false);
      window.addEventListener('mousemove', (e) => { if (dragging) update(e.clientX); });
      window.addEventListener('touchmove', (e) => { if (dragging) update(e.touches[0].clientX); });
    }
  </script>
</body>
</html>
