<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hairu – Stylist & AI Hairstyle</title>
  <style>
    :root {
      --bg-color: #0b0b0d;
      --card-bg: #16161a;
      --accent: #6c5ce7;
      --accent-hover: #5a4bd1;
      --text-color: #ffffff;
      --text-muted: #a0a0a0;
      --border-radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background-color: #000000;
      border: 1px solid #222;
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      position: relative;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }

    /* Wgrywanie plików */
    .upload-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .upload-box {
      background-color: var(--card-bg);
      border: 2px dashed #333;
      border-radius: var(--border-radius);
      height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .upload-box:hover {
      border-color: var(--accent);
      background-color: #1f1f24;
    }

    .upload-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }

    .upload-box span {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      padding: 0 8px;
      pointer-events: none;
    }

    /* Wybór stylów */
    .section-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .styles-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .style-card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .style-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(108, 92, 231, 0.4);
    }

    .style-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      display: block;
    }

    .style-card p {
      text-align: center;
      padding: 6px;
      font-size: 12px;
      font-weight: 600;
      background-color: var(--card-bg);
    }

    /* Przycisk akcji */
    .btn-generate {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #8e2de2, #4a00e0);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 4px 15px rgba(110, 45, 226, 0.3);
    }

    .btn-generate:active {
      transform: scale(0.98);
    }

    /* Overlay ładowania */
    .loader-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      z-index: 10;
      border-radius: 28px;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Komponent porównania Przed/Po (Slider) */
    .result-container {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      border-radius: 28px;
      z-index: 20;
      padding: 20px;
      flex-direction: column;
      justify-content: space-between;
    }

    .comparison-slider {
      position: relative;
      width: 100%;
      height: 380px;
      border-radius: 20px;
      overflow: hidden;
      user-select: none;
    }

    .comparison-slider img {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .img-after {
      width: 100%;
      clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
    }

    .slider-handle {
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      width: 4px;
      background: #fff;
      cursor: ew-resize;
      transform: translateX(-50%);
    }

    .slider-handle::after {
      content: '↔';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 32px; height: 32px;
      background: #fff;
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .badge {
      position: absolute;
      top: 12px;
      padding: 4px 10px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      font-size: 11px;
      font-weight: 700;
      border-radius: 12px;
      letter-spacing: 0.5px;
    }

    .badge-before { left: 12px; }
    .badge-after { right: 12px; }

    .btn-reset {
      width: 100%;
      padding: 14px;
      border: 1px solid #333;
      border-radius: 30px;
      background: #16161a;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Hairu</h1>
      <p>Wygeneruj nową fryzurę ze zdjęcia</p>
    </header>

    <!-- Wgrywanie zdjęć -->
    <div class="upload-section">
      <div class="upload-box" id="box-user" onclick="document.getElementById('user-photo').click()">
        <img id="user-preview" style="display:none;" alt="Zdjęcie użytkownika">
        <span id="user-placeholder">📸 Twoje zdjęcie<br><small style="opacity:0.6">(Wymagane)</small></span>
      </div>
      <input type="file" id="user-photo" accept="image/png, image/jpeg, image/webp" onchange="handleFileSelect(event, 'user-preview', 'user-placeholder')">

      <div class="upload-box" id="box-ref" onclick="document.getElementById('ref-photo').click()">
        <img id="ref-preview" style="display:none;" alt="Wzorzec">
        <span id="ref-placeholder">✂️ Wzorzec<br><small style="opacity:0.6">(Opcjonalnie)</small></span>
      </div>
      <input type="file" id="ref-photo" accept="image/png, image/jpeg, image/webp" onchange="handleFileSelect(event, 'ref-preview', 'ref-placeholder')">
    </div>

    <!-- Wybór fryzury -->
    <div class="section-title">Wybierz stylizacji</div>
    <div class="styles-grid">
      <div class="style-card selected" onclick="selectStyle(this, 'Quiff')">
        <img src="https://images.unsplash.com/photo-1503443207922-dff7d543fd0e?w=300" alt="Quiff">
        <p>Quiff</p>
      </div>
      <div class="style-card" onclick="selectStyle(this, 'Pompadour')">
        <img src="https://images.unsplash.com/photo-1622286342621-4bd786c2447c?w=300" alt="Pompadour">
        <p>Pompadour</p>
      </div>
      <div class="style-card" onclick="selectStyle(this, 'Side Part')">
        <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=300" alt="Side Part">
        <p>Side Part</p>
      </div>
      <div class="style-card" onclick="selectStyle(this, 'Textured Crop')">
        <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=300" alt="Textured Crop">
        <p>Textured Crop</p>
      </div>
    </div>

    <button class="btn-generate" onclick="processLook()">Wygeneruj Nowy Look ✨</button>

    <!-- Screen ładowania -->
    <div class="loader-overlay" id="loader">
      <div class="spinner"></div>
      <p style="font-size: 14px; font-weight: 500;">Generowanie fryzury...</p>
    </div>

    <!-- Ekran wyniku z suwakiem Przed / Po -->
    <div class="result-container" id="result-view">
      <div class="comparison-slider" id="slider">
        <img id="res-before" src="" alt="Przed">
        <img id="res-after" class="img-after" src="" alt="Po">
        <span class="badge badge-before">PRZED</span>
        <span class="badge badge-after">PO</span>
        <div class="slider-handle" id="slider-handle"></div>
      </div>
      <button class="btn-reset" onclick="closeResult()">Stwórz kolejny look</button>
    </div>
  </div>

  <script>
    let activeStyle = 'Quiff';
    let userImageBase64 = null;

    // Obsługa selekcji stylów
    function selectStyle(element, styleName) {
      document.querySelectorAll('.style-card').forEach(card => card.classList.remove('selected'));
      element.classList.add('selected');
      activeStyle = styleName;
    }

    // Bezpieczne wczytywanie i podgląd plików
    function handleFileSelect(event, imgId, placeholderId) {
      const file = event.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        alert('Proszę wybrać plik graficzny (PNG, JPG, WEBP).');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = document.getElementById(imgId);
        img.src = e.target.result;
        img.style.display = 'block';
        document.getElementById(placeholderId).style.display = 'none';

        if (imgId === 'user-preview') {
          userImageBase64 = e.target.result;
        }
      };
      reader.onerror = function() {
        alert('Błąd podczas odczytu pliku.');
      };
      reader.readAsDataURL(file);
    }

    // Generowanie zmodyfikowanego podglądu (przetwarzanie obrazu na Canvas)
    function generateTransformedImage(src, callback) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;

        // Rysowanie oryginalnego zdjęcia
        ctx.drawImage(img, 0, 0);

        // Nakładanie lekkiego filtra stylowego symulującego korektę AI
        ctx.fillStyle = 'rgba(108, 92, 231, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Zwiększenie kontrastu/jasności na płótnie
        ctx.globalCompositeOperation = 'overlay';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        callback(canvas.toDataURL('image/jpeg'));
      };
      img.src = src;
    }

    // Uruchomienie procesu
    function processLook() {
      if (!userImageBase64) {
        alert('Dodaj najpierw swoje zdjęcie!');
        return;
      }

      const loader = document.getElementById('loader');
      loader.style.display = 'flex';

      // Symulacja czasu przetwarzania AI
      setTimeout(() => {
        generateTransformedImage(userImageBase64, function(transformedUrl) {
          document.getElementById('res-before').src = userImageBase64;
          document.getElementById('res-after').src = transformedUrl;

          loader.style.display = 'none';
          document.getElementById('result-view').style.display = 'flex';
          initSlider();
        });
      }, 2000);
    }

    function closeResult() {
      document.getElementById('result-view').style.display = 'none';
    }

    // Działający suwak Przed / Po z obsługą dotyku i myszy
    function initSlider() {
      const slider = document.getElementById('slider');
      const afterImg = document.getElementById('res-after');
      const handle = document.getElementById('slider-handle');
      let isDragging = false;

      function setPosition(x) {
        const rect = slider.getBoundingClientRect();
        let posX = x - rect.left;
        if (posX < 0) posX = 0;
        if (posX > rect.width) posX = rect.width;

        const percentage = (posX / rect.width) * 100;
        afterImg.style.clipPath = `polygon(0 0, ${percentage}% 0, ${percentage}% 100%, 0 100%)`;
        handle.style.left = `${percentage}%`;
      }

      function onMove(e) {
        if (!isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        setPosition(clientX);
      }

      slider.addEventListener('mousedown', (e) => { isDragging = true; setPosition(e.clientX); });
      slider.addEventListener('touchstart', (e) => { isDragging = true; setPosition(e.touches[0].clientX); });

      window.addEventListener('mouseup', () => isDragging = false);
      window.addEventListener('touchend', () => isDragging = false);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('touchmove', onMove);
    }
  </script>
</body>
</html>
